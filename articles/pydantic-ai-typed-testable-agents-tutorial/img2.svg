<svg version="1.1" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: a triage agent calls two tools and returns a validated TicketAction">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/>
</marker>
</defs>
<rect width="960" height="540" fill="#f8fafc"/>
<rect x="40" y="200" width="230" height="140" rx="14" fill="#0f766e"/>
<text x="155" y="258" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Triage agent</text>
<text x="155" y="295" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#ccfbf1">output_type =</text>
<text x="155" y="322" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#ccfbf1">TicketAction</text>
<rect x="400" y="60" width="250" height="100" rx="14" fill="#f59e0b"/>
<text x="525" y="105" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1c1917">tool: order_status</text>
<text x="525" y="138" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1c1917">orders dict lookup</text>
<rect x="400" y="380" width="250" height="100" rx="14" fill="#f59e0b"/>
<text x="525" y="425" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1c1917">tool: customer_tier</text>
<text x="525" y="458" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1c1917">returns tier: pro</text>
<rect x="710" y="200" width="210" height="140" rx="14" fill="#1e293b"/>
<text x="815" y="255" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Validated output</text>
<text x="815" y="292" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#e2e8f0">TicketAction only</text>
<text x="815" y="319" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#e2e8f0">never raw text</text>
<line x1="270" y1="245" x2="395" y2="110" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="270" y1="295" x2="395" y2="430" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="650" y1="110" x2="705" y2="220" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="650" y1="430" x2="705" y2="320" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="470" width="880" height="52" rx="10" fill="#e2e8f0"/>
<text x="480" y="503" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#0f172a">In tests, TestModel and FunctionModel stand in for the real model</text>
</svg>
