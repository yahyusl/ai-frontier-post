<svg version="1.1" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/>
</marker>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
</marker>
</defs>
<rect width="960" height="540" fill="#f8fafc"/>
<text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#0f172a">The hardened agent, layer by layer</text>
<rect x="60" y="90" width="840" height="62" rx="12" fill="#0f766e"/>
<text x="480" y="116" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#ffffff">Agent  ·  output_type=TicketAction</text>
<text x="480" y="138" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e2e8f0">typed output is the contract</text>
<line x1="480" y1="155" x2="480" y2="172" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="178" width="840" height="62" rx="12" fill="#0369a1"/>
<text x="480" y="204" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#ffffff">Capability: refunds</text>
<text x="480" y="226" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e2e8f0">instructions + refund_status tool, bundled</text>
<line x1="480" y1="243" x2="480" y2="260" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="266" width="840" height="62" rx="12" fill="#0369a1"/>
<text x="480" y="292" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#ffffff">ModelFallback  +  RetryOnModelErrors</text>
<text x="480" y="314" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e2e8f0">other model on failure · same model on transient errors</text>
<line x1="480" y1="331" x2="480" y2="348" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="354" width="840" height="62" rx="12" fill="#7c3aed"/>
<text x="480" y="380" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#ffffff">Harness: Goal · Permissions · ToolBridge · WrapUpAtLimits</text>
<text x="480" y="402" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e2e8f0">verify the answer · deny risky tools · hide the catalog · answer before the budget ends</text>
<line x1="480" y1="419" x2="480" y2="436" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="442" width="840" height="62" rx="12" fill="#0f172a"/>
<text x="480" y="468" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#ffffff">Tools: order_status · customer_tier · issue_refund (denied)</text>
<text x="480" y="490" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e2e8f0">the model only ever sees what the layers allow</text>
<line x1="480" y1="507" x2="480" y2="524" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
</svg>